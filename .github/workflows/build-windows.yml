# 在 GitHub 雲端自動編譯 Windows 免安裝版 WarehouseManager.exe，並覆蓋發布 v1.0.0
# （版本號固定 1.0.0，以編譯編號／commit 分新舊；程式開啟時會比對 commit 檢查更新）
# 觸發：推送到 main（程式檔有改動時）、在 Actions 頁面手動執行，或由「Unpack source」解壓後呼叫
name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.js'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

# 同時有兩次編譯時，只留最新的一次（避免舊的蓋掉新的發行版本）
concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4
        with:
          # 由解壓流程呼叫時，要取得解壓後最新的提交
          ref: main

      - name: 記下這次編譯的 commit 與編號（程式用來檢查更新）
        shell: bash
        run: |
          echo "WM_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "WM_BUILD_NO=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 編譯快取
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 產生程式圖示
        run: |
          pip install pillow
          python scripts/make_icons.py

      - name: 安裝前端套件
        run: npm install

      - name: 建置前端
        run: npm run build

      - name: 執行 Rust 單元測試（原子寫入、備份還原、負庫存阻擋）
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 編譯免安裝 EXE
        run: npx tauri build --no-bundle

      - name: 整理輸出檔案
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = "src-tauri/target/release/warehouse-manager.exe"
          if (-not (Test-Path $exe)) { $exe = (Get-ChildItem src-tauri/target/release/*.exe | Select-Object -First 1).FullName }
          Copy-Item $exe out/WarehouseManager.exe
          # 新版本的雜湊值：程式自動更新時用來確認下載的檔案和這裡編譯出來的一模一樣
          $hash = (Get-FileHash out/WarehouseManager.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/WarehouseManager.sha256 -Value "$hash  WarehouseManager.exe" -NoNewline -Encoding ascii
          Get-ChildItem out | Select-Object Name, Length
          Get-Content out/WarehouseManager.sha256

      - name: 上傳 EXE（Actions 頁面可下載）
        uses: actions/upload-artifact@v4
        with:
          name: WarehouseManager-windows
          path: out/WarehouseManager.exe
          if-no-files-found: error

      - name: 發布到 v1.0.0（覆蓋舊的）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --cleanup-tag --yes || true
          git push origin :refs/tags/v1.0.0 || true
          gh release create v1.0.0 out/WarehouseManager.exe out/WarehouseManager.sha256 \
            --latest \
            --target "$WM_BUILD_SHA" \
            --title "倉儲管理系統 v1.0.0（編譯 #${WM_BUILD_NO}）" \
            --notes "Windows 10/11 免安裝版：下載 WarehouseManager.exe，放在可以寫入的資料夾（例如桌面上的新資料夾）直接執行。

          最後更新：$(date -u '+%Y-%m-%d %H:%M UTC')（編譯 #${WM_BUILD_NO}，commit ${WM_BUILD_SHA::7}）

          已經在用的電腦：開啟程式時會自動檢查新版本，按「立即更新」就好，資料不會受影響。

          首次執行若出現 SmartScreen「Windows 已保護您的電腦」，請點「其他資訊」→「仍要執行」。"
