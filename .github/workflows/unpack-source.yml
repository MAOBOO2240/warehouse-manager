# 上傳 source.tar.xz 到儲存庫根目錄後：清除舊原始碼、解壓成一般檔案並提交，接著編譯 EXE
# 注意：.github/workflows 裡的流程檔不會從壓縮檔更新——GitHub 不允許自動流程修改流程檔（整次提交會被拒絕）。
# 要改流程檔，請直接在 GitHub 網頁上編輯或上傳。
name: Unpack source

on:
  push:
    branches: [main]
    paths: ['source.tar.xz']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解壓並提交
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          tar -xJf source.tar.xz -C "$RUNNER_TEMP/src"
          # 流程檔不從壓縮檔更新（見檔案開頭的說明）
          rm -rf "$RUNNER_TEMP/src/WarehouseManager/.github"
          rm -rf src src-tauri/src scripts dev
          cp -a "$RUNNER_TEMP/src/WarehouseManager/." .
          rm -f source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source.tar.xz" || echo "nothing to commit"
          git push

  build:
    needs: unpack
    uses: ./.github/workflows/build-windows.yml
    # 把祕密（UPDATE_TOKEN）交給編譯流程；少了這一行，從壓縮檔編譯出來的版本不會帶更新權杖
    secrets: inherit
    permissions:
      contents: write
