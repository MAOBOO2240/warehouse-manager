# 上傳 source.tar.xz 到儲存庫根目錄後：清除舊原始碼、解壓成一般檔案並提交，接著編譯 EXE
name: Unpack source

on:
  push:
    branches: [main]
    paths: ['source.tar.xz']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解壓並提交
        run: |
          tar -xJf source.tar.xz
          rm -rf src src-tauri/src scripts
          cp -a WarehouseManager/. .
          rm -rf WarehouseManager source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack source.tar.xz" || echo "nothing to commit"
          git push

  build:
    needs: unpack
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: write
