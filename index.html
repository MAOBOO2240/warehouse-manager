<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>倉儲管理系統</title>
    <!-- 程式載入前先套用上次選的外觀：開啟時視窗不會先閃一下別的底色 -->
    <style>
      html { background: #10141a; }
      html[data-palette="mist"] { background: #8a8b8a; }
      html[data-theme="light"] { background: #eceef3; }
    </style>
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          var s = JSON.parse(localStorage.getItem('warehouse-ui-settings') || '{}')
          // 「清除緩存」後重新整理時，設定是經由網址帶回來的
          var m = /[#&]s=([^&]*)/.exec(location.hash)
          if (m) s = JSON.parse(decodeURIComponent(m[1].replace(/\+/g, ' ')))
          if (s && s.theme === 'light') theme = 'light'
          // 深色的另一組配色「霧灰」
          if (s && s.theme === 'mist') document.documentElement.dataset.palette = 'mist'
        } catch (e) {
          /* 讀不到就用預設的深色 */
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
